        /**
         * ============================================================================

         * ============================================================================
         */
        class BulletproofAudioEngine {
            constructor() {
                this.voiceOn = true;
                this.speechRate = 1.2; // Locked strictly at 1.2x speed
                this.recentLines = new Set();
                this.lastLine = "你棚棋真係好Kick呀！Kam到連旺角惠豐中心花旗銀行門口個保安都唔畀你入啦！智商負資產仲學人落場，陣間大破防唔好喊呀免費仔！";
                this.audioCtx = null;
                this.hkVoice = null;

                // Dedicated HTML5 audio element for pure Cantonese cloud stream
                this.ttsAudio = new Audio();
                this.ttsAudio.referrerPolicy = 'no-referrer';
                this.ttsAudio.preload = 'auto';

                this.initCantoneseVoiceOnly();
            }

            getRate() {
                return this.speechRate;
            }

            initCantoneseVoiceOnly() {
                if (!('speechSynthesis' in window)) return;
                const findHkVoice = () => {
                    const voices = window.speechSynthesis.getVoices() || [];
                    // STRICT FILTER: Only match genuine Cantonese / Hong Kong voices. NEVER match zh-CN or zh-TW!
                    this.hkVoice = voices.find(v => {
                        const lang = (v.lang || '').toLowerCase();
                        const name = (v.name || '').toLowerCase();
                        const isCantoneseLang = lang === 'zh-hk' || lang === 'yue-hk' || lang === 'yue' || lang.includes('-hk');
                        const isCantoneseName = name.includes('cantonese') || name.includes('hong kong') || name.includes('粵語') || name.includes('廣東話') || name.includes('sin-ji') || name.includes('hiugaai') || name.includes('hiumaan') || name.includes('wanlung');
                        const isMandarin = lang === 'zh-cn' || lang === 'zh-tw' || lang === 'zh-sg' || name.includes('mandarin') || name.includes('putonghua') || name.includes('taiwan') || name.includes('mainland');
                        return (isCantoneseLang || isCantoneseName) && !isMandarin;
                    }) || null;
                };
                findHkVoice();
                window.speechSynthesis.onvoiceschanged = findHkVoice;
            }

            unlock() {
                try {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (!this.audioCtx && AC) this.audioCtx = new AC();
                    if (this.audioCtx && this.audioCtx.state === 'suspended') {
                        this.audioCtx.resume();
                    }
                } catch (e) {}

                try {
                    this.ttsAudio.muted = true;
                    this.ttsAudio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
                    this.ttsAudio.play().then(() => {
                        this.ttsAudio.pause();
                        this.ttsAudio.muted = false;
                    }).catch(() => {
                        this.ttsAudio.muted = false;
                    });
                } catch (e) {}
            }

            getLine(type) {
                const pool = INSULT_POOLS[type] || INSULT_POOLS.normalMove;
                const unused = pool.filter(item => !this.recentLines.has(item));
                const candidates = unused.length > 0 ? unused : pool;
                if (unused.length === 0) this.recentLines.clear();
                const picked = candidates[Math.floor(Math.random() * candidates.length)];
                this.recentLines.add(picked);
                return picked;
            }

            speak(text) {
                if (text) this.lastLine = text;
                if (!this.voiceOn) return;

                const cleanText = this.lastLine.replace(/[「」]/g, '').trim();
                const targetRate = this.getRate();

                // Stop any ongoing speech
                try {
                    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                    this.ttsAudio.pause();
                } catch (e) {}

                // Priority 1: If verified native HK Cantonese voice exists on device, use it at high speed
                if (!this.hkVoice) this.initCantoneseVoiceOnly();
                if (this.hkVoice && 'speechSynthesis' in window) {
                    try {
                        const u = new SpeechSynthesisUtterance(cleanText);
                        u.voice = this.hkVoice;
                        u.lang = this.hkVoice.lang || 'zh-HK';
                        u.rate = targetRate;
                        u.pitch = 0.96;
                        u.onerror = () => this.playCloudCantonese(cleanText, targetRate);
                        window.speechSynthesis.speak(u);
                        return;
                    } catch (e) {}
                }

                // Priority 2: Pure Cantonese Cloud TTS Stream (tl=yue / tl=zh-HK ONLY, NEVER Mandarin)
                this.playCloudCantonese(cleanText, targetRate);
            }

            playCloudCantonese(cleanText, targetRate) {
                try {
                    const encoded = encodeURIComponent(cleanText);
                    const applySpeed = () => {
                        try {
                            this.ttsAudio.defaultPlaybackRate = targetRate;
                            this.ttsAudio.playbackRate = targetRate;
                        } catch (e) {}
                    };

                    this.ttsAudio.onloadedmetadata = applySpeed;
                    this.ttsAudio.onplay = applySpeed;

                    // Pure Cantonese endpoint #1: tl=yue
                    this.ttsAudio.src = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=yue&q=${encoded}`;
                    applySpeed();

                    const playPromise = this.ttsAudio.play();

        function getPseudoMoves(b, side) {

                            while (onBoard(nr, nc)) {

        function generalsFacingEachOther(b) {

            for (let r = bRow + 1; r < rRow; r++) {

        function isKingInCheck(b, side) {
            if (generalsFacingEachOther(b)) return true;

            for (let r = 0; r < 10; r++) {
                for (let c = 3; c <= 5; c++) {
                    if (b[r][c] === side) { kr = r; kc = c; break; }

            const pseudo = getPseudoMoves(b, side);

                b[m.tr][m.tc] = cap;

            let net = 0;

                    const mov = b[m.fr][m.fc];

                        if (score > alpha) alpha = score;
                    }

                    b[m.fr][m.fc] = mov;
                    b[m.tr][m.tc] = cap;

        function fitCanvas() {

            const aspect = 9 / 10;
            let w = availW;
            let h = w / aspect;
            if (h > availH) {
                h = availH;
                w = h * aspect;
            }

            canvas.width = Math.floor(w);
            canvas.height = Math.floor(h);

            const cs = Math.min(canvas.width / 9.25, canvas.height / 10.25);

        function gridToPixel(r, c) {
            return {

            const c = Math.round((x - layout.ox) / layout.cs);

                const pt = gridToPixel(r, c);

        function drawCornerTicks(cx, cy, s) {

            ctx.lineWidth = 1.2;
            const dirs = [[-1,-1],[1,-1],[-1,1],[1,1]];
            dirs.forEach(([dx, dy]) => {
                const sx = cx + dx * gap;
                const sy = cy + dy * gap;
                if (sx > layout.ox + 2 && sx < layout.ox + 8 * s - 2) {
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(sx + dx * len, sy);
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(sx, sy + dy * len);
                    ctx.stroke();
                }
            });
        }

        function drawChessboard() {
            const w = canvas.width, h = canvas.height;
            const { cs, ox, oy } = layout;
            ctx.clearRect(0, 0, w, h);

            const bgGrad = ctx.createLinearGradient(0, 0, w, h);
            bgGrad.addColorStop(0, '#041226');

                    ctx.lineTo(ox + c * cs, oy + 9 * cs);

                    ctx.moveTo(ox + c * cs, oy);
                    ctx.lineTo(ox + c * cs, oy + 4 * cs);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(ox + c * cs, oy + 5 * cs);
                    ctx.lineTo(ox + c * cs, oy + 9 * cs);
                    ctx.stroke();
                }
            }

            ctx.beginPath();
            ctx.moveTo(ox + 3 * cs, oy); ctx.lineTo(ox + 5 * cs, oy + 2 * cs);
            ctx.moveTo(ox + 5 * cs, oy); ctx.lineTo(ox + 3 * cs, oy + 2 * cs);
            ctx.moveTo(ox + 3 * cs, oy + 7 * cs); ctx.lineTo(ox + 5 * cs, oy + 9 * cs);
            ctx.moveTo(ox + 5 * cs, oy + 7 * cs); ctx.lineTo(ox + 3 * cs, oy + 9 * cs);
            ctx.stroke();

            const markCoords = [
                [2,1],[2,7],[7,1],[7,7],
                [3,0],[3,2],[3,4],[3,6],[3,8],
                [6,0],[6,2],[6,4],[6,6],[6,8]
            ];
            markCoords.forEach(([r, c]) => {
                const pt = gridToPixel(r, c);
                drawCornerTicks(pt.x, pt.y, cs);
            });

            ctx.save();
            ctx.fillStyle = 'rgba(212, 175, 55, 0.72)';
            ctx.font = `900 ${Math.floor(cs * 0.42)}px "Songti TC", "Noto Serif TC", serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('楚 河', ox + 2 * cs, oy + 4.5 * cs);
            ctx.fillText('漢 界', ox + 6 * cs, oy + 4.5 * cs);
            ctx.restore();

            if (lastMoveRecord) {
                [{ r: lastMoveRecord.fr, c: lastMoveRecord.fc }, { r: lastMoveRecord.tr, c: lastMoveRecord.tc }].forEach(cell => {
                    const pos = gridToPixel(cell.r, cell.c);
                    ctx.save();
                    ctx.strokeStyle = '#38BDF8';
                    ctx.lineWidth = 2.2;
                    ctx.setLineDash([4, 3]);
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, cs * 0.45, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                });
            }

            for (let r = 0; r < 10; r++) {
                for (let c = 0; c < 9; c++) {
                    const p = board[r][c];
                    if (p === 0) continue;
                    const pos = gridToPixel(r, c);
                    const isSelected = selectedCell && selectedCell.r === r && selectedCell.c === c;
                    draw3DPiece(pos.x, pos.y, p, cs * 0.43, isSelected);
                }
            }

            legalTargets.forEach(m => {
                const pos = gridToPixel(m.tr, m.tc);
                ctx.save();
                if (board[m.tr][m.tc] !== 0) {
                    ctx.strokeStyle = '#F43F5E';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, cs * 0.45, 0, Math.PI * 2);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = 'rgba(212, 175, 55, 0.92)';
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, cs * 0.14, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            });
        }

        function draw3DPiece(x, y, code, rad, isSel) {
            const isRed = code > 0;
            ctx.save();
            if (isSel) {
                y -= 4;
                ctx.shadowColor = '#FDE047';
                ctx.shadowBlur = 18;
            } else {
                ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
                ctx.shadowBlur = 7;
                ctx.shadowOffsetY = 3;
            }

            const rimGrad = ctx.createLinearGradient(x - rad, y - rad, x + rad, y + rad);
            if (isRed) {
                rimGrad.addColorStop(0, '#FFF3B0');
                rimGrad.addColorStop(0.5, '#D4AF37');
                rimGrad.addColorStop(1, '#78530A');
            } else {
                rimGrad.addColorStop(0, '#94A3B8');
                rimGrad.addColorStop(0.5, '#334155');
                rimGrad.addColorStop(1, '#0F172A');
            }
            ctx.beginPath();
            ctx.arc(x, y, rad, 0, Math.PI * 2);
            ctx.fillStyle = rimGrad;
            ctx.fill();

            const coreGrad = ctx.createRadialGradient(x - rad * 0.22, y - rad * 0.22, rad * 0.1, x, y, rad * 0.85);
            if (isRed) {
                coreGrad.addColorStop(0, '#B91C1C');
                coreGrad.addColorStop(0.75, '#7F1D1D');
                coreGrad.addColorStop(1, '#450A0A');
            } else {
                coreGrad.addColorStop(0, '#0F294A');
                coreGrad.addColorStop(0.75, '#061529');
                coreGrad.addColorStop(1, '#020813');
            }
            ctx.beginPath();
            ctx.arc(x, y, rad * 0.84, 0, Math.PI * 2);
            ctx.fillStyle = coreGrad;
            ctx.fill();

            ctx.fillStyle = isRed ? '#FEF08A' : '#38BDF8';
            ctx.font = `900 ${Math.floor(rad * 1.05)}px "Songti TC", "Noto Serif TC", serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(PIECE_CHARS[String(code)], x, y + 1);
            ctx.restore();
        }

        function handleBoardClick(e) {
            if (!isPlaying || currentTurn !== 1) return;
            audio.unlock();

            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const cell = pixelToGrid(clientX - rect.left, clientY - rect.top);
            if (!cell) return;

            if (selectedCell) {
                const chosenMove = legalTargets.find(m => m.tr === cell.r && m.tc === cell.c);
                if (chosenMove) {
                    executePlayerMove(chosenMove);
                    return;
                }
            }

            if (board[cell.r][cell.c] > 0) {
                selectedCell = cell;
                legalTargets = getLegalMoves(board, 1).filter(m => m.fr === cell.r && m.fc === cell.c);
                audio.playClack(false);
                drawChessboard();
            } else {
                selectedCell = null;
                legalTargets = [];
                drawChessboard();
            }
        }

        function executePlayerMove(move) {
            const evalBefore = evaluateBoard(board);

            const cap = board[move.tr][move.tc];
            const mov = board[move.fr][move.fc];
            board[move.tr][move.tc] = mov;
            board[move.fr][move.fc] = 0;

            selectedCell = null;
            legalTargets = [];
            lastMoveRecord = move;

            audio.playClack(cap !== 0);
            drawChessboard();

            const evalAfter = evaluateBoard(board);
            const isBlunder = (evalAfter - evalBefore) > 250;

            const aiLegalMoves = getLegalMoves(board, -1);
            if (aiLegalMoves.length === 0) {
                finishMatch(
                    '👑',
                    '奇蹟反勝・打爆莊家',
                    '你竟然頂住毒舌壓力，親手將死咗惠豐中心花旗代表！',
                    '「無可能！你呢種散戶點可能贏到我？！一定係個系統出Bug！」'
                );
                return;
            }

            const aiChecked = isKingInCheck(board, -1);
            if (aiChecked) {
                audio.playCheckAlert();
                flashCenterBanner('將軍！');
                triggerTaunt('playerChecks', 2);
            } else if (cap !== 0) {
                triggerTaunt('playerCaptures', 3);
            } else if (isBlunder) {
                triggerTaunt('blunderMove', 10);
            } else {
                triggerTaunt('normalMove', 5);
            }

            if (!isPlaying) return;

            currentTurn = -1;
            if (idleTimer) clearTimeout(idleTimer);
            document.getElementById('aiThinkingDot').classList.remove('hidden');

            setTimeout(() => {
                if (!isPlaying) return;
                const aiMove = findBestAiMove(board);
                document.getElementById('aiThinkingDot').classList.add('hidden');

                if (!aiMove) return;

                const aiCap = board[aiMove.tr][aiMove.tc];
                const aiPiece = board[aiMove.fr][aiMove.fc];
                board[aiMove.tr][aiMove.tc] = aiPiece;
                board[aiMove.fr][aiMove.fc] = 0;
                lastMoveRecord = aiMove;

                audio.playClack(aiCap !== 0);
                drawChessboard();

                const playerReplies = getLegalMoves(board, 1);
                const playerInCheck = isKingInCheck(board, 1);

                if (playerReplies.length === 0) {
                    audio.playCheckAlert();
                    finishMatch(
                        '📉',
                        '絕殺斬倉・負資產收場',
                        '你已經被徹底將死，連惠豐中心花旗同破產管理署都救唔返你棚爛棋。',
                        audio.getLine('defeat')
                    );
                    return;
                }

                if (playerInCheck) {
                    audio.playCheckAlert();
                    flashCenterBanner('將軍 Call Loan！');
                    triggerTaunt('aiChecks', 14);
                } else if (aiCap !== 0) {
                    const isMajor = Math.abs(aiCap) === 4 || Math.abs(aiCap) === 5 || Math.abs(aiCap) === 6;
                    triggerTaunt(isMajor ? 'aiCapturesMajor' : 'aiCapturesMinor', isMajor ? 15 : 8);
                }

                currentTurn = 1;
                restartIdleWatch();
            }, 250);
        }

        function launchNewMatch() {
            audio.unlock();
            board = createInitialBoard();
            currentTurn = 1;
            selectedCell = null;
            legalTargets = [];
            lastMoveRecord = null;
            willpower = 100;
            isPlaying = true;

            document.getElementById('willpowerFill').style.width = '100%';
            document.getElementById('willpowerText').textContent = '100%';
            document.getElementById('startModal').classList.add('hidden');
            document.getElementById('endModal').classList.add('hidden');

            fitCanvas();
            triggerTaunt('opening', 0);
            restartIdleWatch();
        }

        canvas.addEventListener('mousedown', handleBoardClick);
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            handleBoardClick(e);
        }, { passive: false });

        document.getElementById('enterGameBtn').addEventListener('click', launchNewMatch);
        document.getElementById('restartAfterEndBtn').addEventListener('click', launchNewMatch);

        document.getElementById('replayBtn').addEventListener('click', () => {
            audio.unlock();
            audio.speak(audio.lastLine);
        });

        document.getElementById('voiceBtn').addEventListener('click', e => {
            audio.unlock();
            audio.voiceOn = !audio.voiceOn;
            e.currentTarget.textContent = audio.voiceOn ? '🔊 純粵語' : '🔇 靜音';
            e.currentTarget.classList.toggle('text-emerald-300', audio.voiceOn);
            e.currentTarget.classList.toggle('text-slate-400', !audio.voiceOn);
            if (audio.voiceOn) audio.speak(audio.lastLine);
        });

        window.addEventListener('resize', fitCanvas);
        window.onload = fitCanvas;
    </script>
</body>
</html>
